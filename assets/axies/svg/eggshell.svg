<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Eggshell">
  <title>Eggshell</title>
  <defs>
    <radialGradient id="g_eggshell" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffc0da"/>
      <stop offset="0.62" stop-color="#ff8cbe"/>
      <stop offset="1" stop-color="#d4568c"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.900) translate(-64 -84)">
    <ellipse cx="104" cy="88" rx="8" ry="6" fill="#d4568c"/>
    

    <!-- legs -->
    <g fill="#d4568c">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_eggshell)"/>

    
    <g fill="#ffc0da" stroke="#d4568c" stroke-width="2">
      <path d="M44 46 q4 -18 18 -18 q-4 12 -6 20 z"/>
      <path d="M84 46 q-4 -18 -18 -18 q4 12 6 20 z"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="50" cy="70" rx="10" ry="11" fill="#20242b"/>
      <ellipse cx="78" cy="70" rx="10" ry="11" fill="#20242b"/>
      <circle cx="47" cy="66" r="3.6" fill="#fff"/>
      <circle cx="75" cy="66" r="3.6" fill="#fff"/>
      <circle cx="54" cy="75" r="1.8" fill="#fff" opacity=".75"/>
      <circle cx="82" cy="75" r="1.8" fill="#fff" opacity=".75"/>
    </g>
    

    <!-- blush -->
    <g fill="#d4568c" opacity=".38">
      <ellipse cx="37" cy="83" rx="6" ry="4"/>
      <ellipse cx="91" cy="83" rx="6" ry="4"/>
    </g>

    
    <path d="M55 81 l9 12 l9 -12 z" fill="#8f2f57"/>
    <path d="M55 81 h18" stroke="#d4568c" stroke-width="1.5"/>
  </g>
</svg>
