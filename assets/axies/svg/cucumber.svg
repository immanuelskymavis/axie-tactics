<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cucumber">
  <title>Cucumber</title>
  <defs>
    <radialGradient id="g_cucumber" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#cef27e"/>
      <stop offset="0.62" stop-color="#a8df3d"/>
      <stop offset="1" stop-color="#6ea622"/>
