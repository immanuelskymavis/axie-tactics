<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Goda">
  <title>Goda</title>
  <defs>
    <radialGradient id="g_goda" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.62" stop-color="#fdb014"/>
      <stop offset="1" stop-color="#c9820b"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.996) translate(-64 -84)">
    
    <path d="M95 84 q20 -2 20 10 q0 10 -12 8 q-8 -2 -6 -8"
          fill="none" stroke="#c9820b" stroke-width="6" stroke-linecap="round"/>
    

    <!-- legs -->
    <g fill="#c9820b">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_goda)"/>

    
    <path d="M40 50 l6 -20 l8 12 l10 -18 l10 18 l8 -12 l6 20 z"
          fill="#ffd166" stroke="#c9820b" stroke-width="2" stroke-linejoin="round"/>

    <!-- eyes -->
    <g>
      <ellipse cx="50" cy="70" rx="10" ry="11" fill="#20242b"/>
      <ellipse cx="78" cy="70" rx="10" ry="11" fill="#20242b"/>
      <circle cx="47" cy="66" r="3.6" fill="#fff"/>
      <circle cx="75" cy="66" r="3.6" fill="#fff"/>
      <circle cx="54" cy="75" r="1.8" fill="#fff" opacity=".75"/>
      <circle cx="82" cy="75" r="1.8" fill="#fff" opacity=".75"/>
    </g>
    <g stroke="#8a5a10" stroke-width="3.4" stroke-linecap="round">
      <path d="M41 59 l14 5"/>
      <path d="M87 59 l-14 5"/>
    </g>

    <!-- blush -->
    <g fill="#c9820b" opacity=".38">
      <ellipse cx="37" cy="83" rx="6" ry="4"/>
      <ellipse cx="91" cy="83" rx="6" ry="4"/>
    </g>

    
    <path d="M52 83 q12 14 24 0 z" fill="#8a5a10"/>
    <path d="M52 83 h24" stroke="#8a5a10" stroke-width="2"/>
  </g>
</svg>
