<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Anemone">
  <title>Anemone</title>
  <defs>
    <radialGradient id="g_anemone" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#8ee5f5"/>
      <stop offset="0.62" stop-color="#3fc5e0"/>
      <stop offset="1" stop-color="#1f8fa8"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.964) translate(-64 -84)">
    
    <path d="M95 84 q20 -2 20 10 q0 10 -12 8 q-8 -2 -6 -8"
          fill="none" stroke="#1f8fa8" stroke-width="6" stroke-linecap="round"/>
    

    <!-- legs -->
    <g fill="#1f8fa8">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_anemone)"/>

    
    <g stroke="#1f8fa8" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M43 48 q-12 -16 -17.142857142857142 -20"/><path d="M57 48 q-5 -24 -7.142857142857143 -28"/><path d="M71 48 q2 -16 2.857142857142857 -20"/><path d="M85 48 q9 -24 12.857142857142858 -28"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="50" cy="70" rx="10" ry="11" fill="#20242b"/>
      <ellipse cx="78" cy="70" rx="10" ry="11" fill="#20242b"/>
      <circle cx="47" cy="66" r="3.6" fill="#fff"/>
      <circle cx="75" cy="66" r="3.6" fill="#fff"/>
      <circle cx="54" cy="75" r="1.8" fill="#fff" opacity=".75"/>
      <circle cx="82" cy="75" r="1.8" fill="#fff" opacity=".75"/>
    </g>
    

    <!-- blush -->
    <g fill="#1f8fa8" opacity=".38">
      <ellipse cx="37" cy="83" rx="6" ry="4"/>
      <ellipse cx="91" cy="83" rx="6" ry="4"/>
    </g>

    
    <ellipse cx="64" cy="87" rx="7" ry="5.5" fill="none" stroke="#12626f" stroke-width="3"/>
  </g>
</svg>
