<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Bone Sail">
  <title>Bone Sail</title>
  <defs>
    <radialGradient id="g_bonesail" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#d7aef0"/>
      <stop offset="0.62" stop-color="#b673e0"/>
      <stop offset="1" stop-color="#8244ad"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.996) translate(-64 -84)">
    
    <path d="M95 84 q20 -2 20 10 q0 10 -12 8 q-8 -2 -6 -8"
          fill="none" stroke="#8244ad" stroke-width="6" stroke-linecap="round"/>
    
    <path d="M38 62 q26 -34 52 0 q-26 -12 -52 0 z" fill="#8244ad"/>
    <path d="M46 56 q18 -18 36 0" fill="none" stroke="#5b2679" stroke-width="2.5" opacity=".6"/>

    <!-- legs -->
    <g fill="#8244ad">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_bonesail)"/>

    
    <g fill="#d7aef0" stroke="#8244ad" stroke-width="2" stroke-linejoin="round">
      <path d="M54 46 q-4 -24 8 -30 q10 8 6 30 z"/>
      <path d="M70 46 q8 -20 18 -20 q-4 14 -10 22 z"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="50" cy="70" rx="10" ry="11" fill="#20242b"/>
      <ellipse cx="78" cy="70" rx="10" ry="11" fill="#20242b"/>
      <circle cx="47" cy="66" r="3.6" fill="#fff"/>
      <circle cx="75" cy="66" r="3.6" fill="#fff"/>
      <circle cx="54" cy="75" r="1.8" fill="#fff" opacity=".75"/>
      <circle cx="82" cy="75" r="1.8" fill="#fff" opacity=".75"/>
    </g>
    <g stroke="#5b2679" stroke-width="3.4" stroke-linecap="round">
      <path d="M41 59 l14 5"/>
      <path d="M87 59 l-14 5"/>
    </g>

    <!-- blush -->
    <g fill="#8244ad" opacity=".38">
      <ellipse cx="37" cy="83" rx="6" ry="4"/>
      <ellipse cx="91" cy="83" rx="6" ry="4"/>
    </g>

    
    <path d="M53 83 q11 12 22 0 z" fill="#5b2679"/>
    <path d="M58 84 l3 6 l3 -6 z M65 84 l3 6 l3 -6 z" fill="#fff"/>
  </g>
</svg>
