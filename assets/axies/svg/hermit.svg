<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Hermit">
  <title>Hermit</title>
  <defs>
    <radialGradient id="g_hermit" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#8ee5f5"/>
      <stop offset="0.62" stop-color="#3fc5e0"/>
      <stop offset="1" stop-color="#1f8fa8"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.996) translate(-64 -84)">
    <ellipse cx="104" cy="88" rx="8" ry="6" fill="#1f8fa8"/>
    
    <g>
      <ellipse cx="64" cy="70" rx="42" ry="36" fill="#1f8fa8" opacity=".55"/>
      <path d="M28 66 a36 30 0 0 1 72 0" fill="none" stroke="#12626f" stroke-width="3" opacity=".5"/>
    </g>

    <!-- legs -->
    <g fill="#1f8fa8">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_hermit)"/>

    
    <g fill="#8ee5f5" stroke="#1f8fa8" stroke-width="2">
      <path d="M44 46 q4 -18 18 -18 q-4 12 -6 20 z"/>
      <path d="M84 46 q-4 -18 -18 -18 q4 12 6 20 z"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="50" cy="70" rx="10" ry="11" fill="#20242b"/>
      <ellipse cx="78" cy="70" rx="10" ry="11" fill="#20242b"/>
      <circle cx="47" cy="66" r="3.6" fill="#fff"/>
      <circle cx="75" cy="66" r="3.6" fill="#fff"/>
      <circle cx="54" cy="75" r="1.8" fill="#fff" opacity=".75"/>
      <circle cx="82" cy="75" r="1.8" fill="#fff" opacity=".75"/>
    </g>
    <g stroke="#12626f" stroke-width="3.4" stroke-linecap="round">
      <path d="M41 59 l14 5"/>
      <path d="M87 59 l-14 5"/>
    </g>

    <!-- blush -->
    <g fill="#1f8fa8" opacity=".38">
      <ellipse cx="37" cy="83" rx="6" ry="4"/>
      <ellipse cx="91" cy="83" rx="6" ry="4"/>
    </g>

    <path d="M55 85 q9 9 18 0" fill="none" stroke="#12626f" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
