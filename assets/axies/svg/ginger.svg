    <g fill="#6ea622" opacity=".95">
      <path d="M34 64 q-22 -8 -28 -26 q22 -2 32 14 z"/>
      <path d="M94 64 q22 -8 28 -26 q-22 -2 -32 14 z"/>
    </g>

    <!-- legs -->
    <g fill="#6ea622">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_ginger)"/>

    
    <g>
      <path d="M64 46 q-16 -12 -6 -24 q10 6 6 24" fill="#6ea622"/>
      <path d="M64 46 q16 -12 6 -24 q-10 6 -6 24" fill="#cef27e"/>
