<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ginger">
  <title>Ginger</title>
  <defs>
    <radialGradient id="g_ginger" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#cef27e"/>
      <stop offset="0.62" stop-color="#a8df3d"/>
      <stop offset="1" stop-color="#6ea622"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.932) translate(-64 -84)">
    
    <g fill="#6ea622">
      <path d="M95 82 q20 -10 28 2 q-14 12 -28 4 z"/>
      <path d="M103 88 q14 2 18 14 q-14 2 -20 -8 z" opacity=".8"/>
