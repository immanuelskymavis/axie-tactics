<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zigzag">
  <title>Zigzag</title>
  <defs>
    <radialGradient id="g_zigzag" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.62" stop-color="#fdb014"/>
      <stop offset="1" stop-color="#c9820b"/>
    </radialGradient>
  </defs>

  <g class="axie" transform="translate(64 84) scale(0.932) translate(-64 -84)">
    
    <g fill="#c9820b">
      <path d="M95 82 l24 -6 l-8 12 l14 2 l-24 8 z"/>
    </g>
    

    <!-- legs -->
    <g fill="#c9820b">
      <ellipse cx="42" cy="108" rx="9" ry="7"/>
      <ellipse cx="57"  cy="111" rx="9" ry="7"/>
      <ellipse cx="72"  cy="111" rx="9" ry="7"/>
      <ellipse cx="87" cy="108" rx="9" ry="7"/>
    </g>

    <!-- body -->
    <ellipse cx="64" cy="76" rx="37" ry="34" fill="url(#g_zigzag)"/>

    
    <g stroke="#c9820b" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M50 46 l-8 -14 m0 0 l-9 3 m9 -3 l1 -9"/>
      <path d="M78 46 l8 -14 m0 0 l9 3 m-9 -3 l-1 -9"/>
    </g>

    <!-- eyes -->
    <g>
      <ellipse cx="50" cy="70" rx="10" ry="11" fill="#20242b"/>
      <ellipse cx="78" cy="70" rx="10" ry="11" fill="#20242b"/>
      <circle cx="47" cy="66" r="3.6" fill="#fff"/>
      <circle cx="75" cy="66" r="3.6" fill="#fff"/>
      <circle cx="54" cy="75" r="1.8" fill="#fff" opacity=".75"/>
      <circle cx="82" cy="75" r="1.8" fill="#fff" opacity=".75"/>
    </g>
    

    <!-- blush -->
    <g fill="#c9820b" opacity=".38">
      <ellipse cx="37" cy="83" rx="6" ry="4"/>
      <ellipse cx="91" cy="83" rx="6" ry="4"/>
    </g>

    
    <path d="M53 83 q11 12 22 0 z" fill="#8a5a10"/>
    <path d="M58 84 l3 6 l3 -6 z M65 84 l3 6 l3 -6 z" fill="#fff"/>
  </g>
</svg>
